
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graj i Zbieraj</title>
<style>
body{font-family:Arial;background:#101827;color:white;text-align:center;padding:20px}
main{max-width:420px;margin:auto}
section{background:#1c2b40;padding:20px;border-radius:14px;margin:16px 0}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:0;border-radius:8px}
button{background:#42d392;color:#102018;font-weight:bold}
#status{color:#ffd166}
</style>
</head>
<body>
<main>
<h1>🎮 Graj i Zbieraj</h1>
<section>
<h2>Twoje konto</h2>
<input id="email" type="email" placeholder="Adres e-mail">
<input id="password" type="password" placeholder="Hasło (minimum 6 znaków)">
<button id="register">Zarejestruj się</button>
<button id="login">Zaloguj się</button>
<button id="logout">Wyloguj się</button>
<p id="status">Nie jesteś zalogowany.</p>
</section>
<section>
<h2>Twoje punkty</h2>
<p style="font-size:32px" id="points">0</p>
<p>Saldo pobierane z Twojego konta.</p>
<button id="refresh">Odśwież saldo</button>
</section>
</main>
<script type="module">
import {createClient} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
'https://tuavmryeaoqfloisdjlw.supabase.co',
'sb_publishable_jOYQmwgBgJBCLCtC_HjnZQ_RxPmZ8kD'
);

const status=document.getElementById('status');
const points=document.getElementById('points');

async function refreshAccount(){
 const {data:{user},error}=await supabase.auth.getUser();
 if(error||!user){
  status.textContent='Nie jesteś zalogowany.';
  points.textContent='0';
  return;
 }
 const {data,error:walletError}=await supabase
  .from('wallets')
  .select('points_balance')
  .eq('user_id',user.id)
  .single();

 if(walletError){
  status.textContent='Błąd odczytu portfela: '+walletError.message;
  return;
 }
 status.textContent='Zalogowano: '+user.email;
 points.textContent=data.points_balance;
}

document.getElementById('register').onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 if(!email||password.length<6){
  status.textContent='Podaj e-mail i hasło (minimum 6 znaków).';
  return;
 }
 const {error}=await supabase.auth.signUp({email,password});
 status.textContent=error?error.message:
 'Rejestracja wysłana. Sprawdź pocztę, jeśli wymagane jest potwierdzenie.';
};

document.getElementById('login').onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const {error}=await supabase.auth.signInWithPassword({email,password});
 status.textContent=error?error.message:'Logowanie poprawne.';
 if(!error) await refreshAccount();
};

document.getElementById('logout').onclick=async()=>{
 await supabase.auth.signOut();
 points.textContent='0';
 status.textContent='Wylogowano.';
};

document.getElementById('refresh').onclick=refreshAccount;

supabase.auth.onAuthStateChange((_event,session)=>{
 if(session) setTimeout(refreshAccount,0);
});
refreshAccount();
</script>
</body>
</html>
