
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Graj i Zbieraj</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#101827;color:white;text-align:center;padding:20px;margin:0}
main{max-width:460px;margin:auto}
section{background:#1c2b40;padding:20px;border-radius:14px;margin:16px 0}
input,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:8px;font-size:16px}
input{background:white;color:#172033}
button{background:#42d392;color:#102018;font-weight:bold}
.secondary{background:#34465f;color:white}
#status{color:#ffd166;overflow-wrap:anywhere}
#points{font-size:42px;color:#42d392;font-weight:bold}
.small{color:#b9c7d8;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>🎮 Graj i Zbieraj</h1>

<section id="authPanel">
<h2>Logowanie i rejestracja</h2>
<input id="email" type="email" placeholder="Adres e-mail">
<input id="password" type="password" placeholder="Hasło">
<button id="register">Zarejestruj się</button>
<button id="login">Zaloguj się</button>
</section>

<section id="accountPanel" class="hidden">
<h2>Twój panel</h2>
<p id="userEmail"></p>
<p>Twoje saldo punktów:</p>
<p id="points">0</p>
<button id="refresh">Odśwież saldo</button>
<button id="logout" class="secondary">Wyloguj się</button>
</section>

<p id="status">Sprawdzanie konta...</p>
<p class="small">Punkty są przyznawane po weryfikacji wyniku przez serwer.</p>
</main>

<script type="module">
import {createClient} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
'https://tuavmryeaoqfloisdjlw.supabase.co',
'sb_publishable_jOYQmwgBgJBCLCtC_HjnZQ_RxPmZ8kD'
);

const authPanel=document.getElementById('authPanel');
const accountPanel=document.getElementById('accountPanel');
const status=document.getElementById('status');
const points=document.getElementById('points');

function signedOut(message){
 authPanel.classList.remove('hidden');
 accountPanel.classList.add('hidden');
 points.textContent='0';
 status.textContent=message;
}

async function loadAccount(){
 const {data:{user},error:userError}=await supabase.auth.getUser();

 if(userError||!user){
  signedOut('Nie jesteś zalogowany.');
  return;
 }

 authPanel.classList.add('hidden');
 accountPanel.classList.remove('hidden');
 document.getElementById('userEmail').textContent=user.email||'';
 status.textContent='Zalogowano.';

 const {data,error}=await supabase
 .from('wallets')
 .select('points_balance')
 .eq('user_id',user.id)
 .single();

 if(error){
  status.textContent='Błąd salda: '+error.message;
  return;
 }

 points.textContent=String(data.points_balance??0);
}

document.getElementById('register').onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;

 if(!email||password.length<6){
  status.textContent='Podaj e-mail i hasło minimum 6 znaków.';
  return;
 }

 const {error}=await supabase.auth.signUp({
  email,password,
  options:{
   emailRedirectTo:'https://android1999-sudo.github.io/Graj-i-zarabiaj/'
  }
 });

 status.textContent=error?error.message:
 'Rejestracja wysłana. Sprawdź pocztę.';
};

document.getElementById('login').onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;

 const {error}=await supabase.auth.signInWithPassword({
  email,password
 });

 if(error){
  status.textContent=error.message;
  return;
 }

 await loadAccount();
};

document.getElementById('refresh').onclick=loadAccount;

document.getElementById('logout').onclick=async()=>{
 const {error}=await supabase.auth.signOut();
 if(error){
  status.textContent=error.message;
  return;
 }
 signedOut('Wylogowano.');
};

supabase.auth.onAuthStateChange((event,session)=>{
 if(session) setTimeout(loadAccount,0);
 else if(event==='SIGNED_OUT') signedOut('Wylogowano.');
});

loadAccount();
</script>
</body>
</html>
